<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Chat — DwellSync</title>
  <link rel="stylesheet" href="css/community-chat.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-logo-svg" width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="11" fill="#1f4d45"/><path d="M24 8L10 16V36L24 44L38 36V16L24 8Z" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 8V44" stroke="#c89b5c" stroke-width="1.8" stroke-dasharray="2 3"/><path d="M10 16L24 24L38 16" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="5" fill="#c89b5c"/><path d="M24 20V28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/><path d="M20 24H28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/></svg>
        <div><div class="brand-title">DwellSync</div><span class="badge badge-confirmed" style="font-size:10px;">Resident</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="profile.html" class="nav-item">My Profile</a>
        <a href="maintenance.html" class="nav-item">Maintenance</a>
        <a href="community-chat.html" class="nav-item active">Community Chat</a>
        <a href="announcements.html" class="nav-item">Announcements</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-item" style="color:var(--color-danger);margin-top:auto;">Logout</a>
      </nav>
    </aside>
    <main class="main-viewport">
      <div class="content-container">
        <div class="page-header"><div><h1 class="page-title">Community Lounge</h1><p class="page-subtitle">Real-time ephemeral community chat for active residents</p></div></div>
        <div class="chat-grid-container">
          <div class="chat-card"><div class="chat-alert-banner"><strong>Notice:</strong> Community messages are temporary and are not permanently stored.</div><div class="chat-messages-scroll" id="chatMessages"></div><form class="chat-input-bar" id="chatForm"><input type="text" id="chatMessageInput" placeholder="Type a message to your neighbors... (Enter to send)" required autocomplete="off"><button type="submit" class="btn btn-primary">Send</button></form></div>
          <div class="card card-body" style="height:100%;"><h3 style="font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;"><span>Online Residents</span><span id="activeResidentsCount" class="badge badge-confirmed">1 Online</span></h3><div id="activeResidentsList" style="overflow-y:auto;"></div></div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/community-chat.js"></script>
</body>
</html>
