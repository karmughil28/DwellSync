<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Profile — DwellSync</title>
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-logo-svg" width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="11" fill="#1f4d45"/><path d="M24 8L10 16V36L24 44L38 36V16L24 8Z" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 8V44" stroke="#c89b5c" stroke-width="1.8" stroke-dasharray="2 3"/><path d="M10 16L24 24L38 16" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="5" fill="#c89b5c"/><path d="M24 20V28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/><path d="M20 24H28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/></svg>
        <div><div class="brand-title">DwellSync</div><span class="badge badge-confirmed" style="font-size:10px;">Resident</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="profile.html" class="nav-item active">My Profile</a>
        <a href="maintenance.html" class="nav-item">Maintenance</a>
        <a href="community-chat.html" class="nav-item">Community Chat</a>
        <a href="announcements.html" class="nav-item">Announcements</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-item" style="color:var(--color-danger);margin-top:auto;">Logout</a>
      </nav>
    </aside>
    <main class="main-viewport">
      <div class="content-container">
        <div class="page-header"><div><h1 class="page-title">Resident Profile</h1><p class="page-subtitle">Personal and apartment occupancy record</p></div></div>
        <div class="profile-layout-grid">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Personal Details</h2><button class="btn btn-secondary btn-sm" id="btnEditProfile">Edit</button></div>
            <div class="card-body">
              <form id="profileForm">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="profName" class="form-input" disabled required></div>
                <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="profPhone" class="form-input" disabled required></div>
                <div class="form-group"><label class="form-label">Email (Immutable)</label><input type="email" id="profEmail" class="form-input" disabled></div>
                <div class="form-group"><label class="form-label">Flat Assigned (Immutable)</label><input type="text" id="profFlat" class="form-input" disabled></div>
                <div id="profileActions" style="display:none;gap:10px;"><button type="submit" class="btn btn-primary">Save Changes</button><button type="button" class="btn btn-secondary" id="btnCancelEdit">Cancel</button></div>
              </form>
            </div>
          </div>
          <div class="card"><div class="card-header"><h2 class="card-title">Apartment Information</h2></div><div class="card-body"><div style="padding:16px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:16px;"><div style="font-size:12px;color:#94a3b8;">UNIT NUMBER</div><h3 style="font-size:24px;color:var(--color-primary);margin-top:2px;">Flat <span id="cardFlat">—</span></h3></div><div><strong>Tenancy:</strong> <span id="cardTenure">—</span><br><strong>Status:</strong> <span style="color:var(--color-success);font-weight:600;">Active Account</span></div></div></div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
