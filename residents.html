<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Management — DwellSync</title>
  <link rel="stylesheet" href="../css/residents.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-logo-svg" width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="11" fill="#1f4d45"/><path d="M24 8L10 16V36L24 44L38 36V16L24 8Z" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 8V44" stroke="#c89b5c" stroke-width="1.8" stroke-dasharray="2 3"/><path d="M10 16L24 24L38 16" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="5" fill="#c89b5c"/><path d="M24 20V28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/><path d="M20 24H28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/></svg>
        <div><div class="brand-title">DwellSync</div><span class="badge badge-pending" style="font-size:10px;">Administrator</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item">Dashboard</a>
        <a href="residents.html" class="nav-item active">Residents</a>
        <a href="maintenance.html" class="nav-item">Maintenance</a>
        <a href="announcements.html" class="nav-item">Announcements</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-item" style="color:var(--color-danger);margin-top:auto;">Logout</a>
      </nav>
    </aside>
    <main class="main-viewport">
      <div class="content-container">
        <div class="page-header"><div><h1 class="page-title">Resident Management</h1><p class="page-subtitle">Configure accounts for Flats A-101 to A-115</p></div><button class="btn btn-primary" id="btnOpenAddModal">Add Resident</button></div>
        <div class="card card-body" style="margin-bottom:16px;"><input type="text" id="searchResidents" class="form-input" placeholder="Search by resident name, flat (e.g. A-102), or email..."></div>
        <div class="card"><div class="table-responsive"><table class="custom-table"><thead><tr><th>Flat #</th><th>Name</th><th>Email</th><th>Phone</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody id="residentsTableBody"></tbody></table></div></div>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="residentModal">
    <div class="modal-card">
      <div class="modal-header"><h3 class="card-title" id="modalTitle">Add Resident</h3><button class="btn btn-secondary btn-sm" id="btnCloseModal">&times;</button></div>
      <div class="modal-body">
        <form id="residentForm">
          <div class="form-group"><label class="form-label">Flat Number</label><select id="resFlat" class="form-select" required></select></div>
          <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="resName" class="form-input" required></div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" id="resEmail" class="form-input" required></div>
          <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="resPhone" class="form-input" required></div>
          <div class="form-group"><label class="form-label">Resident Type</label><select id="resType" class="form-select"><option value="Owner">Owner</option><option value="Tenant" selected>Tenant</option></select></div>
          <div class="form-group" id="passGroup"><label class="form-label">Initial Password</label><input type="text" id="resPassword" class="form-input" value="resident123" required></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Save Resident</button>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="resetPassModal">
    <div class="modal-card">
      <div class="modal-header"><h3 class="card-title">Reset Password</h3><button class="btn btn-secondary btn-sm" id="btnCloseResetModal">&times;</button></div>
      <div class="modal-body">
        <p style="margin-bottom:12px;font-size:13.5px;">Set new password for <strong id="resetPassName">—</strong>:</p>
        <form id="resetPassForm">
          <div class="form-group"><input type="text" id="newPassInput" class="form-input" placeholder="Enter new password" required></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/auth.js"></script>
  <script src="../js/residents.js"></script>
</body>
</html>
