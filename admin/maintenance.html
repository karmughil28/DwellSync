<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Complaints — DwellSync Admin</title>
  <link rel="stylesheet" href="../css/admin-maintenance.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-logo-svg" width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="11" fill="#1f4d45"/><path d="M24 8L10 16V36L24 44L38 36V16L24 8Z" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 8V44" stroke="#c89b5c" stroke-width="1.8" stroke-dasharray="2 3"/><path d="M10 16L24 24L38 16" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="5" fill="#c89b5c"/><path d="M24 20V28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/><path d="M20 24H28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/></svg>
        <div><div class="brand-title">DwellSync</div><span class="badge badge-pending" style="font-size:10px;">Administrator</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item">Dashboard</a>
        <a href="residents.html" class="nav-item">Residents</a>
        <a href="maintenance.html" class="nav-item active">Maintenance</a>
        <a href="announcements.html" class="nav-item">Announcements</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-item" style="color:var(--color-danger);margin-top:auto;">Logout</a>
      </nav>
    </aside>
    <main class="main-viewport">
      <div class="content-container">
        <div class="page-header"><div><h1 class="page-title">Community Maintenance Desk</h1><p class="page-subtitle">Inspect tickets and update workflow statuses</p></div></div>
        <div class="complaint-filter-bar">
          <input type="text" id="searchComplaint" class="form-input" style="flex:1;min-width:200px;" placeholder="Search ticket, resident, flat...">
          <select id="filterCat" class="form-select" style="width:auto;"><option value="">All Categories</option><option value="Plumbing">Plumbing</option><option value="Electrical">Electrical</option><option value="Water">Water</option><option value="Cleaning">Cleaning</option><option value="Lift">Lift</option><option value="Common Area">Common Area</option><option value="Other">Other</option></select>
          <select id="filterPrio" class="form-select" style="width:auto;"><option value="">All Priorities</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select>
          <select id="filterStatus" class="form-select" style="width:auto;"><option value="">All Statuses</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option><option value="Resident Confirmed">Resident Confirmed</option><option value="Closed">Closed</option></select>
        </div>
        <div class="card"><div class="table-responsive"><table class="custom-table"><thead><tr><th>Complaint</th><th>Resident</th><th>Flat</th><th>Category</th><th>Priority</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminMaintenanceTableBody"></tbody></table></div></div>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="ticketModal">
    <div class="modal-card">
      <div class="modal-header"><h3 class="card-title" id="modalTicketTitle">Manage Ticket</h3><button class="btn btn-secondary btn-sm" id="btnCloseModal">&times;</button></div>
      <div class="modal-body">
        <p id="modalResidentInfo" style="font-size:13px;color:#64748b;margin-bottom:12px;"></p>
        <div style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:16px;">
          <strong style="font-size:12px;color:#94a3b8;">DESCRIPTION:</strong>
          <p id="modalDesc" style="white-space:pre-wrap;font-size:13.5px;margin-top:4px;"></p>
          <img id="modalPhoto" style="display:none;max-width:100%;max-height:180px;margin-top:10px;border-radius:6px;">
        </div>
        <div style="margin-bottom:16px;"><strong>Current Status:</strong> <span class="badge" id="modalStatusBadge">Pending</span></div>
        <div style="margin-bottom:20px;"><label class="form-label">Update Status</label><div id="statusActions" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
        <div><label class="form-label">Audit History</label><ul id="modalAuditLog" style="font-size:12.5px;padding-left:20px;max-height:140px;overflow-y:auto;"></ul></div>
      </div>
    </div>
  </div>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-maintenance.js"></script>
</body>
</html>
