<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console Sign In — DwellSync</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
  <header class="login-header">
    <a href="../index.html" style="text-decoration:none;display:flex;align-items:center;gap:12px;">
      <svg class="brand-logo-svg" width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="11" fill="#1f4d45"/><path d="M24 8L10 16V36L24 44L38 36V16L24 8Z" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 8V44" stroke="#c89b5c" stroke-width="1.8" stroke-dasharray="2 3"/><path d="M10 16L24 24L38 16" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="5" fill="#c89b5c"/><path d="M24 20V28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/><path d="M20 24H28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/></svg>
      <div><div class="brand-title">DwellSync</div><div class="brand-tag">Admin Console</div></div>
    </a>
    <a href="../resident-login.html" class="btn btn-secondary btn-sm">Switch to Resident Login</a>
  </header>
  <div class="login-center-box">
    <div class="login-card">
      <span class="login-role-pill pill-admin">Administrator Access</span>
      <h2 style="font-size:22px;color:var(--color-dark);margin-bottom:6px;">Administrator Sign In</h2>
      <p style="font-size:13.5px;color:var(--color-text-muted);margin-bottom:24px;">Community Governance, Resident Directory &amp; Complaints Desk</p>
      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label">Administrator Email</label>
          <input type="email" id="adminEmail" class="form-input" value="admin@dwellsync.local" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="adminPass" class="form-input" value="admin123" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In to Admin Console</button>
      </form>
      <div class="demo-credentials">
        <strong>Default Administrator Credentials:</strong><br>
        Email: <span style="color:var(--color-primary);font-weight:600;">admin@dwellsync.local</span><br>
        Password: <span style="color:var(--color-primary);font-weight:600;">admin123</span>
      </div>
      <a href="../resident-login.html" class="switch-portal-link">Are you a resident? <span>Go to Resident Portal</span></a>
    </div>
  </div>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value.trim().toLowerCase();
      const pass = document.getElementById("adminPass").value.trim();
      if (email === "admin@dwellsync.local" && pass === "admin123") {
        setCurrentUser({ id: "admin-1", name: "Community Manager", email, role: "admin", flat: "Office" });
        showToast("Welcome, Administrator!", "success");
        setTimeout(() => window.location.href = "admin-dashboard.html", 400);
        return;
      }
      showToast("Invalid administrator credentials.", "danger");
    });
  </script>
</body>
</html>
