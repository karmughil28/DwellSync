<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Tickets — DwellSync</title>
  <link rel="stylesheet" href="css/maintenance.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-logo-svg" width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="11" fill="#1f4d45"/><path d="M24 8L10 16V36L24 44L38 36V16L24 8Z" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 8V44" stroke="#c89b5c" stroke-width="1.8" stroke-dasharray="2 3"/><path d="M10 16L24 24L38 16" stroke="#c89b5c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="5" fill="#c89b5c"/><path d="M24 20V28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/><path d="M20 24H28" stroke="#1f4d45" stroke-width="2" stroke-linecap="round"/></svg>
        <div><div class="brand-title">DwellSync</div><span class="badge badge-confirmed" style="font-size:10px;">Resident</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="profile.html" class="nav-item">My Profile</a>
        <a href="maintenance.html" class="nav-item active">Maintenance</a>
        <a href="community-chat.html" class="nav-item">Community Chat</a>
        <a href="announcements.html" class="nav-item">Announcements</a>
        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-item" style="color:var(--color-danger);margin-top:auto;">Logout</a>
      </nav>
    </aside>
    <main class="main-viewport">
      <div class="content-container">
        <div class="page-header"><div><h1 class="page-title">Maintenance Requests</h1><p class="page-subtitle">Track and file tickets for your apartment</p></div><button class="btn btn-primary" id="btnOpenModal">File New Complaint</button></div>
        <div class="card"><div class="table-responsive"><table class="custom-table"><thead><tr><th>Ticket ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Date Filed</th><th>Action</th></tr></thead><tbody id="complaintsTableBody"></tbody></table></div></div>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="newComplaintModal">
    <div class="modal-card">
      <div class="modal-header"><h3 class="card-title">File Maintenance Complaint</h3><button class="btn btn-secondary btn-sm" id="btnCloseModal">&times;</button></div>
      <div class="modal-body">
        <form id="newComplaintForm">
          <div class="form-group"><label class="form-label">Category</label><select id="compCategory" class="form-select" required><option value="Plumbing">Plumbing</option><option value="Electrical">Electrical</option><option value="Water">Water</option><option value="Cleaning">Cleaning</option><option value="Lift">Lift</option><option value="Common Area">Common Area</option><option value="Other">Other</option></select></div>
          <div class="form-group"><label class="form-label">Ticket Title</label><input type="text" id="compTitle" class="form-input" placeholder="e.g. Bathroom sink leakage" required></div>
          <div class="form-group"><label class="form-label">Priority</label><select id="compPriority" class="form-select"><option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option></select></div>
          <div class="form-group"><label class="form-label">Description</label><textarea id="compDesc" class="form-textarea" placeholder="Detailed description..." required></textarea></div>
          <div class="form-group"><label class="form-label">Photo (Optional)</label><input type="file" id="compPhoto" class="form-input" accept="image/*"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Submit Complaint</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/maintenance.js"></script>
</body>
</html>
